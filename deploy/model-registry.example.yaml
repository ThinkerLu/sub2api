version: 1

# This file is intentionally outside the runtime image. Mount its containing
# directory read-only into the container and edit it on the host to update
# capabilities or pricing without changing the request's upstream model name.
models:
  deepseek-flash:
    capability_profile: deepseek-flash-vision
    pricing_profile: deepseek-flash-vision

capability_profiles:
  deepseek-flash-vision:
    display_name: DeepSeek V4.1 Flash
    description: DeepSeek coding and reasoning model routed through Sub2API.
    input_modalities: [text, image]
    context_window: 1048576
    max_context_window: 1048576
    supports_reasoning: true
    default_reasoning_level: high
    supported_reasoning_levels: [low, high, max]
    supports_parallel_tool_calls: true

pricing_profiles:
  deepseek-flash-vision:
    # USD per token. This is the DeepSeek V4.1 Flash off-peak base profile.
    input_price_per_token: 0.00000015
    output_price_per_token: 0.00000060
    cache_read_price_per_token: 0.000000003
